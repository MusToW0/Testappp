name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: android-actions/setup-android@v2
    - name: Build APK
      run: |
        echo "APK Derleme Başladı"
        mkdir -p app/src/main/java/com/test/app
        cd app
        aapt2 compile --dir src/main/res -o res.zip || true
        aapt2 link -o base.apk -I $ANDROID_HOME/platforms/android-33/android.jar --manifest src/main/AndroidManifest.xml || true
        javac -d obj src/main/java/com/test/app/*.java || true
        d8 --output . obj/com/test/app/*.class || true
        zip -j base.apk classes.dex || true
        apksigner sign --ks debug.keystore --ks-pass pass:android --out final.apk base.apk || true
    - uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: app/final.apk
